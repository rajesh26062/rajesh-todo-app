<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Focus — To-Do</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#17171c;--muted:#73737e;--line:#e9e9ef;--accent:#635bff;--accent2:#5048ea;--danger:#e34d59;--shadow:0 18px 60px rgba(28,25,50,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#eeecff 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}.shell{min-height:100vh;padding:34px 18px}.app{max-width:1050px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:42px;letter-spacing:-.05em;margin:5px 0 0;line-height:1}.sub{color:var(--muted);margin:10px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 13px;min-width:85px;box-shadow:var(--shadow)}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.add{padding:18px;display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 135px 145px;gap:10px}
input,select{width:100%;border:1px solid var(--line);background:#fafafd;border-radius:13px;padding:13px 14px;outline:none;color:var(--text)}input:focus,select:focus{border-color:#b6b1ff;box-shadow:0 0 0 4px rgba(99,91,255,.09)}
.btn{border:0;border-radius:13px;padding:13px 17px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background}.btn:hover{transform:translateY(-1px)}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}
.toolbar{padding:15px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{flex:1;min-width:220px}.filters{display:flex;gap:8px}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:700}.chip.active{background:#efeefe;color:var(--accent);border-color:#d8d5ff}
.list{padding:10px 12px 16px}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 8px;border-bottom:1px solid #f0f0f4}.task:last-child{border-bottom:0}.check{width:22px;height:22px;border-radius:7px;border:2px solid #d7d7e0;background:#fff;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:13px;font-weight:900}.task.done .check{background:var(--accent);border-color:var(--accent)}.task.done .text{text-decoration:line-through;color:#aaa}
.text{font-weight:750}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#f0f0f5;color:#676773}.p-high{background:#fff0f1;color:#c63743}.p-medium{background:#fff7df;color:#976c00}.p-low{background:#edf8f1;color:#287245}
.actions{display:flex;gap:6px}.icon{border:0;background:transparent;color:#999;padding:7px;border-radius:10px;cursor:pointer}.icon:hover{background:#f4f4f8;color:var(--danger)}
.footer{display:flex;justify-content:space-between;gap:10px;padding:14px 18px 18px;color:var(--muted);font-size:12px}
@media (max-width:760px){.top{align-items:start;flex-direction:column}.title{font-size:36px}.add{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .task-input{grid-column:1/-1}.stats{width:100%}.stat{flex:1}.footer{flex-direction:column}}
@media (max-width:480px){.row{grid-template-columns:1fr}.toolbar{align-items:stretch}.filters{overflow:auto}.chip{white-space:nowrap}.task{grid-template-columns:auto 1fr}.actions{grid-column:2}.footer{font-size:11px}}
</style>
</head>
<body>
<div class="shell"><main class="app">
<section class="top">
<div><div class="eyebrow">Daily command center</div><h1 class="title">Get things done.</h1><p class="sub">A simple, fast to-do list that remembers your tasks on this device.</p></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="open">0</b><span>Open</span></div><div class="stat"><b id="done">0</b><span>Done</span></div></div>
</section>
<section class="card">
<form class="add" id="form">
<div class="row"><input class="task-input" id="task" required maxlength="120" placeholder="What needs to be done?"/><select id="priority"><option value="low">Low priority</option><option value="medium" selected>Medium priority</option><option value="high">High priority</option></select><input id="due" type="date"/></div>
<button class="btn primary">Add task</button>
</form>
<div class="toolbar"><input class="search" id="search" placeholder="Search tasks…"/><div class="filters" id="filters"><button type="button" class="chip active" data-filter="all">All</button><button type="button" class="chip" data-filter="active">Active</button><button type="button" class="chip" data-filter="done">Completed</button></div></div>
<div class="list" id="list"></div>
<div class="footer"><span id="summary">0 tasks</span><button type="button" class="chip" id="clear">Clear completed</button></div>
</section>
</main></div>
<script>
const KEY='focus-todos-v1';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
let filter='all', query='';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function labelDate(d){if(!d)return ''; const t=new Date(d+'T00:00:00'); return t.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function visible(){return tasks.filter(t=>{const f=filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done); const q=!query||t.text.toLowerCase().includes(query); return f&&q}).sort((a,b)=>Number(a.done)-Number(b.done)||Number(b.created)-Number(a.created))}
function render(){
 $('total').textContent=tasks.length; $('open').textContent=tasks.filter(t=>!t.done).length; $('done').textContent=tasks.filter(t=>t.done).length;
 const items=visible(); $('summary').textContent=items.length+' task'+(items.length===1?'':'s')+(query?' matching search':'');
 $('list').innerHTML=items.length?items.map(t=>`<div class="task ${t.done?'done':''}">
<button class="check" aria-label="Toggle task" data-toggle="${t.id}">${t.done?'✓':''}</button>
<div><div class="text">${esc(t.text)}</div><div class="meta"><span class="tag ${t.priority==='high'?'p-high':t.priority==='medium'?'p-medium':'p-low'}">${t.priority} priority</span>${t.due?`<span class="tag">Due ${labelDate(t.due)}</span>`:''}</div></div>
<div class="actions"><button class="icon" aria-label="Delete task" data-delete="${t.id}">✕</button></div></div>`).join(''):`<div class="empty"><strong>${query?'No matching tasks':'You’re all clear.'}</strong><span>${query?'Try a different search.':'Add a task above to get started.'}</span></div>`;
}
$('form').addEventListener('submit',e=>{e.preventDefault(); const text=$('task').value.trim(); if(!text)return; tasks.unshift({id:crypto.randomUUID(),text,priority:$('priority').value,due:$('due').value,done:false,created:Date.now()}); $('task').value=''; $('due').value=''; save(); $('task').focus()});
$('list').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; if(b.dataset.toggle){const t=tasks.find(x=>x.id===b.dataset.toggle); if(t)t.done=!t.done; save()} if(b.dataset.delete){tasks=tasks.filter(x=>x.id!==b.dataset.delete); save()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});
$('clear').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save()});
render();
</script>
</body>
</html>
